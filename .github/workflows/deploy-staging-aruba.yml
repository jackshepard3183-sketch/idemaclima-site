name: Deploy staging to Aruba

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: idemaclima-staging-aruba
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp rsync zip php-cli

      - name: Run smoke tests
        run: bash tests/run_all.sh

      - name: Upload warranty certificate sample
        uses: actions/upload-artifact@v4
        with:
          name: warranty-certificate-sample
          path: /tmp/idemaclima-warranty-certificate-*.pdf
          if-no-files-found: error
          retention-days: 1

      - name: Build staging package
        run: bash scripts/build_staging_package.sh

      - name: Verify package does not contain secrets
        run: |
          test -d build/idemaclima-staging
          test ! -f build/idemaclima-staging/.env
          test -f build/idemaclima-staging/DEPLOY_SHA256SUMS.txt

      - name: Upload staging package
        uses: actions/upload-artifact@v4
        with:
          name: idemaclima-staging
          path: build/idemaclima-staging.zip
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to Aruba /idemaclima
        env:
          FTP_SERVER: ${{ secrets.ARUBA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing ARUBA_FTP_SERVER secret}"
          : "${FTP_USERNAME:?Missing ARUBA_FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Missing ARUBA_FTP_PASSWORD secret}"
          FTP_SERVER="$FTP_SERVER" FTP_USERNAME="$FTP_USERNAME" FTP_PASSWORD="$FTP_PASSWORD" \
            bash scripts/deploy_changed_ftps.sh

          # Aruba does not expose SSH. Run pending migrations through a
          # short-lived, randomly named and signed wrapper, then remove it.
          MIGRATION_TOKEN="$(openssl rand -hex 32)"
          MIGRATION_FILE="idemaclima-migrate-$(openssl rand -hex 24).php"
          export MIGRATION_TOKEN MIGRATION_FILE
          umask 077
          php -r '
            $token = getenv("MIGRATION_TOKEN");
            $source = "<?php\ndeclare(strict_types=1);\n" .
              "ini_set(\x27display_errors\x27, \x271\x27); error_reporting(E_ALL);\n" .
              "if ((\$_SERVER[\x27REQUEST_METHOD\x27] ?? \x27\x27) !== \x27POST\x27 || !hash_equals(\x27" . $token . "\x27, (string)(\$_SERVER[\x27HTTP_X_IDEMA_MIGRATION_TOKEN\x27] ?? \x27\x27))) { http_response_code(404); exit; }\n" .
              "define(\x27IDEMA_INTERNAL_MIGRATION_RUN\x27, true);\n" .
              "\$argv = [__FILE__, \x27--execute\x27, \x27--accept-legacy-baseline\x27]; \$_SERVER[\x27argv\x27] = \$argv; \$_SERVER[\x27argc\x27] = 3;\n" .
              "require __DIR__ . \x27/scripts/migrate.php\x27;\n";
            file_put_contents("/tmp/" . getenv("MIGRATION_FILE"), $source);
          '

          cleanup_migration_wrapper() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF || true
            set ftp:ssl-allow yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            rm -f /www.rappresentanzeguanzirolisas.it/idemaclima/$MIGRATION_FILE
            bye
          EOF
            rm -f "/tmp/$MIGRATION_FILE"
          }
          trap cleanup_migration_wrapper EXIT

          WRAPPER_VERIFIED=0
          for attempt in 1 2 3; do
            rm -f "/tmp/$MIGRATION_FILE.remote"
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
            set ftp:ssl-allow yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            set net:max-retries 2
            set net:timeout 20
            put /tmp/$MIGRATION_FILE -o /www.rappresentanzeguanzirolisas.it/idemaclima/$MIGRATION_FILE
            lcd /tmp
            get /www.rappresentanzeguanzirolisas.it/idemaclima/$MIGRATION_FILE -o $MIGRATION_FILE.remote
            bye
          EOF
            then
              if cmp -s "/tmp/$MIGRATION_FILE" "/tmp/$MIGRATION_FILE.remote"; then
                WRAPPER_VERIFIED=1
                break
              fi
            fi
            echo "Migration wrapper integrity retry $attempt."
          done
          test "$WRAPPER_VERIFIED" = "1"
          rm -f "/tmp/$MIGRATION_FILE.remote"

          HTTP_CODE="$(curl --silent --show-error --request POST \
            --header "X-IDEMA-MIGRATION-TOKEN: $MIGRATION_TOKEN" \
            --output /tmp/idemaclima-migration-output.txt \
            --write-out '%{http_code}' \
            "https://www.rappresentanzeguanzirolisas.it/idemaclima/$MIGRATION_FILE")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Migration wrapper returned HTTP $HTTP_CODE." >&2
            cat /tmp/idemaclima-migration-output.txt >&2
            exit 1
          fi
          if ! grep -q 'Completato. Migration applicate:' /tmp/idemaclima-migration-output.txt; then
            echo 'Migration runner did not confirm completion.' >&2
            sed -E 's#(password|secret|token)[^[:space:]]*#REDACTED#gI' /tmp/idemaclima-migration-output.txt >&2
            exit 1
          fi
          cleanup_migration_wrapper
          trap - EXIT

      - name: Mirror remote assets into staging
        env:
          FTP_SERVER: ${{ secrets.ARUBA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ASSET_TOKEN="$(openssl rand -hex 32)"
          ASSET_FILE="idemaclima-assets-$(openssl rand -hex 24).php"
          export ASSET_TOKEN ASSET_FILE
          php -r '
            $token = getenv("ASSET_TOKEN");
            $source = "<?php\\ndeclare(strict_types=1);\\n" .
              "ini_set(\\x27display_errors\\x27, \\x271\\x27); error_reporting(E_ALL); set_time_limit(900);\\n" .
              "if ((\\$_SERVER[\\x27REQUEST_METHOD\\x27] ?? \\x27\\x27) !== \\x27POST\\x27 || !hash_equals(\\x27" . $token . "\\x27, (string)(\\$_SERVER[\\x27HTTP_X_IDEMA_ASSET_TOKEN\\x27] ?? \\x27\\x27))) { http_response_code(404); exit; }\\n" .
              "\\$argv = [__FILE__, \\x27--execute\\x27]; \\$_SERVER[\\x27argv\\x27] = \\$argv; \\$_SERVER[\\x27argc\\x27] = 2;\\n" .
              "require __DIR__ . \\x27/scripts/mirror_remote_assets.php\\x27;\\n";
            file_put_contents("/tmp/" . getenv("ASSET_FILE"), $source);
          '
          cleanup_asset_wrapper() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF || true
            set ftp:ssl-allow yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            rm -f /www.rappresentanzeguanzirolisas.it/idemaclima/$ASSET_FILE
            bye
          EOF
            rm -f "/tmp/$ASSET_FILE"
          }
          trap cleanup_asset_wrapper EXIT
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          put /tmp/$ASSET_FILE -o /www.rappresentanzeguanzirolisas.it/idemaclima/$ASSET_FILE
          bye
          EOF
          HTTP_CODE="$(curl --silent --show-error --max-time 900 --request POST \\
            --header "X-IDEMA-ASSET-TOKEN: $ASSET_TOKEN" \\
            --output /tmp/idemaclima-assets-output.txt \\
            --write-out '%{http_code}' \\
            "https://www.rappresentanzeguanzirolisas.it/idemaclima/$ASSET_FILE")"
          cat /tmp/idemaclima-assets-output.txt
          test "$HTTP_CODE" = "200"
          grep -q 'EXECUTE remote assets migration' /tmp/idemaclima-assets-output.txt
          cleanup_asset_wrapper
          trap - EXIT

      - name: Verify public staging endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 \
            https://www.rappresentanzeguanzirolisas.it/idemaclima/health \
            -o /tmp/idemaclima-health.json
          test -s /tmp/idemaclima-health.json
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 \
            https://www.rappresentanzeguanzirolisas.it/idemaclima/ \
            -o /tmp/idemaclima-home.html
          test -s /tmp/idemaclima-home.html
